# Standard resource quota template for app namespaces.
# Applied automatically via Terraform namespace module.
# Override per-namespace by adjusting values in the Terraform namespace config.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: standard-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: standard-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
