# kube-prometheus-stack Helm chart overrides
# Chart: prometheus-community/kube-prometheus-stack
# Release: prometheus (namespace: monitoring)
#
# Sized for the small SPOT node pool on otterworks-dev: single replicas,
# modest requests, 7-day retention. Control-plane component scraping that does
# not work on EKS (etcd, controller-manager, scheduler, kube-proxy) is disabled.

fullnameOverride: prometheus

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: observability-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Prometheus"
    hosts:
      - prometheus.otterworks.app
    paths:
      - /
    pathType: Prefix
    # No secretName: ingress-nginx serves the cert-manager wildcard
    # (ingress-nginx/otterworks-wildcard-tls, *.otterworks.app) as its default certificate.
    tls:
      - hosts:
          - prometheus.otterworks.app
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 15GB
    # Discover ServiceMonitor / PodMonitor / PrometheusRule objects in every
    # namespace regardless of labels so tenants (otterworks-<id>) can ship their own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: observability-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Alertmanager"
    hosts:
      - alertmanager.otterworks.app
    paths:
      - /
    pathType: Prefix
    tls:
      - hosts:
          - alertmanager.otterworks.app
  alertmanagerSpec:
    replicas: 1
    # Routing/receivers live in the Secret rendered from
    # helm-releases/monitoring/alertmanager/alertmanager.yaml.tpl at apply time
    # (webhook URLs are never committed). The chart's inline `alertmanager.config`
    # is ignored when configSecret is set.
    configSecret: alertmanager-config
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
